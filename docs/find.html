<script>
(function(){fetch('data/library.json').then(function(r){return r.json()}).then(function(LIB){
var $=function(s,r){return (r||document).querySelector(s)},dlg=$('#dlg'),db=$('#db');
var LINKS={
  join:'https://community.aigovops-foundation.com/signin.html',
  substack:'https://aigovops.substack.com/subscribe',
  luma:'https://luma.com/sfaigovops',
  gatecheck:'https://community.aigovops-foundation.com/gate-check.html?src=front-door',

  cal:'',
  founders:'https://www.aigovops-foundation.com/founders.html'
};
function go(u){window.open(u,'_blank','noopener')}

function th(){var d=new Date(),n=(4-d.getDay()+7)%7||7,o=[];for(var i=0;i<3;i++){var x=new Date(d);x.setDate(d.getDate()+n+7*i);o.push(x)}return o}
var TH=th(),fmt=function(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
if($('#dMon'))$('#dMon').textContent=TH[0].toLocaleDateString('en-US',{month:'short'}).toUpperCase();if($('#dDay')){$('#dDay').textContent=TH[0].getDate();$('#nextLabel').textContent='Next: '+fmt(TH[0])+' →'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function done(h,a){return '<div class="done" role="status">'+h+'</div><p class="agent">'+a+'</p>'}
var F={
member:['Become a member',function(){return '<p>Free, forever. We send a sign-in link, so there is no password.</p><label for="em">Email</label><input id="em" type="email" placeholder="you@example.com"><button class="btn full" data-go>Send my link</button>'},function(){return done('<b>Almost there.</b> Finish signing up in the tab we just opened. After that you get the Library, the Thursday meetings and the member tables.','Concierge agent: welcomes you in your language and suggests a first worksheet. No founder approval needed.')}],
give:['Give some money',function(){return '<p>The AiGovOps Foundation is a 501(c)(3), so your gift is tax-deductible.</p><div class="opts" role="group" aria-label="Frequency" style="grid-template-columns:1fr 1fr"><button class="opt" aria-pressed="true" data-g="f">One-time</button><button class="opt" aria-pressed="false" data-g="f">Monthly</button></div><div class="opts" role="group" aria-label="Amount"><button class="opt" aria-pressed="false" data-g="a">$25</button><button class="opt" aria-pressed="true" data-g="a">$100</button><button class="opt" aria-pressed="false" data-g="a">$1,000</button><button class="opt" aria-pressed="false" data-g="a">Other</button></div><button class="btn full" data-go>Continue to secure checkout</button><p style="font-size:13px;margin-top:10px">Organisations: $10,000 Founding Steward partnerships are on the Give page.</p>'},function(){return done('<b>Thank you.</b> Secure checkout opened in a new tab. Your receipt and a tax letter arrive by email.','Herald agent: sends the thank-you and the receipt, and adds you to the supporters page if you opted in. Money only comes in; refunds and payouts need a founder.')}],
meet:['Join a meeting',function(){return '<p>Thursdays, 15:00–16:00 Pacific, online. Pick a date.</p><div class="slots" style="grid-template-columns:1fr">'+TH.map(function(d,i){return '<button class="opt" aria-pressed="'+(i?'false':'true')+'" data-g="t">'+fmt(d)+' · 15:00 PT</button>'}).join('')+'</div><button class="btn full" data-go>Save my seat</button>'},function(){return done('<b>One more click.</b> RSVP on the Luma page we just opened, and you get the invite and a reminder.','Host agent: RSVPs, reminders, the room link and the recording. A human host marks the worksheets.')}],
news:['Read the newsletter',function(){return '<p>A weekly Substack on AI governance: what changed, why it matters, and one thing to try. It\'s free.</p><label for="em">Email</label><input id="em" type="email" placeholder="you@example.com"><button class="btn full" data-go>Subscribe</button><p style="font-size:13px;margin-top:10px">Or read it at aigovops.substack.com</p>'},function(){return done('<b>Confirm on Substack</b> in the tab we just opened. Issues are free.','Scribe agent: drafts each issue from the 1,000-source watch, and a founder has 24 hours to say no. Default: it sends.')}],
audit:['Get an audit plan',function(){var Q=['Does the AI take actions (send, buy, change records) and not only answer?','Is there a written rule for what it may never do?','Can a named person pause it within an hour?','Could you show a regulator exactly what it did last Tuesday?'];return '<p>Four sample questions out of the full ten. Answer them about one AI system you know.</p>'+Q.map(function(q,i){return '<div class="q"><b style="font-size:15px">'+(i+1)+'. '+q+'</b><div role="group" aria-label="Question '+(i+1)+'"><button class="opt" aria-pressed="false" data-g="q'+i+'">Yes</button><button class="opt" aria-pressed="false" data-g="q'+i+'">No</button><button class="opt" aria-pressed="false" data-g="q'+i+'">Not sure</button></div></div>'}).join('')+'<button class="btn full" data-go>Make my plan</button>'},function(){var G=['Pre-pend gate: put a gate in front of every action (worksheet 100).','Policy gate: write the rule and test it in CI (worksheet 200).','Operate gate: name a person who can pause it (worksheet 300).','Audit gate: sign a receipt for every decision (worksheet 400).'],no=[];document.querySelectorAll('.q').forEach(function(q,i){var p=q.querySelector('[aria-pressed=true]');if(!p||p.textContent!=='Yes')no.push(G[i])});return done('<b>Your audit plan</b><ol class="plan">'+(no.length?no.map(function(x){return '<li>'+x+'</li>'}).join(''):'<li>Every gate is in place. Next step: prove it on a Thursday.</li>')+'</ol>Want the full ten questions and a signed Gate Card? <a href="'+LINKS.gatecheck+'" target="_blank" rel="noopener">Run the Gate Check</a>.','Auditor agent: builds the plan from your answers without storing them; only the verdict is kept. If you want a person to review it, book the founders.')}],
book:['Book time with the founders',function(){var S=['Tue 09:00','Tue 13:30','Wed 10:00','Wed 15:00','Fri 08:30','Fri 11:00'];return '<p>20 minutes. Who would you like to meet?</p><div class="opts" role="group" aria-label="Founder" style="grid-template-columns:1fr 1fr 1fr"><button class="opt" aria-pressed="true" data-g="w">Either</button><button class="opt" aria-pressed="false" data-g="w">Ken</button><button class="opt" aria-pressed="false" data-g="w">Bob</button></div><p style="margin-bottom:6px">Open slots (Pacific)</p><div class="slots" role="group" aria-label="Time">'+S.map(function(s){return '<button class="opt" aria-pressed="false" data-g="s">'+s+'</button>'}).join('')+'</div><label for="em">Email</label><input id="em" type="email" placeholder="you@example.com"><button class="btn full" data-go>Book it</button>'},function(){return done('<b>Pick your time</b> in the tab we just opened. Say what you would like to cover and the founders get a one-page brief.','Concierge agent: books only into slots the founders opened, writes the brief, and handles reschedules. The founders just show up.')}]};
var ACT={
member:function(){go(LINKS.join)},
news:function(e){go(LINKS.substack+'?email='+e)},
meet:function(){go(LINKS.luma)},
give:function(){var f=sel('f')==='Monthly'?'monthly':'once',a=sel('a').replace(/[$,]/g,'');go((LINKS.stripe[f]||{})[a]||LINKS.give)},
book:function(e){go(LINKS.cal?LINKS.cal+'?email='+e:LINKS.founders)}
};
var last;
function open(k){var f=F[k];if(!f)return;last=document.activeElement;$('#dt').textContent=f[0];db.innerHTML=f[1]();dlg.showModal();var i=db.querySelector('input,button');i&&i.focus();db.dataset.k=k}
document.addEventListener('click',function(e){var o=e.target.closest('[data-open]');if(o){e.preventDefault();open(o.dataset.open);return}
if(e.target.closest('[data-close]')){dlg.close();return}
var g=e.target.closest('[data-g]');if(g){g.parentNode.querySelectorAll('[data-g="'+g.dataset.g+'"]').forEach(function(b){b.setAttribute('aria-pressed',b===g?'true':'false')});return}
if(e.target.closest('[data-go]')){var em=db.querySelector('input[type=email]');if(em&&!/.+@.+\..+/.test(em.value)){em.setAttribute('aria-invalid','true');em.placeholder='Please enter an email';em.focus();return}var k=db.dataset.k,ev=em?encodeURIComponent(em.value):'';ACT[k]&&ACT[k](ev);db.innerHTML=F[k][2]();var c=document.createElement('button');c.className='btn ghost full';c.style.marginTop='12px';c.textContent='Done';c.setAttribute('data-close','');db.appendChild(c);c.focus()}});
dlg.addEventListener('close',function(){last&&last.focus()});
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
// library
var TY=['All','Case','Worksheet','Tool','Guide','Demo','Plan','Process'],GT=['Any','NIST','EU AI Act','OWASP','ISO'],st={ty:'All',g:'Any',q:'',n:12};
var tc=document.querySelectorAll('.chips')[0],gc=$('#gates');
TY.forEach(function(t){var b=document.createElement('button');b.className='chip';b.textContent=t+(t==='All'?'':' ('+LIB.filter(function(x){return x.ty===t}).length+')');b.setAttribute('aria-pressed',t==='All');b.onclick=function(){st.ty=t;st.n=12;tc.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});render()};tc.appendChild(b)});
GT.forEach(function(t){var b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',t==='Any');b.onclick=function(){st.g=t;st.n=12;gc.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});render()};gc.appendChild(b)});
$('#tot').textContent=LIB.length;
function render(){var q=st.q.toLowerCase().split(/\s+/).filter(Boolean);var r=LIB.filter(function(x){if(st.ty!=='All'&&x.ty!==st.ty)return false;if(st.g!=='Any'&&x.fw.join(' ').indexOf(st.g)<0)return false;var h=(x.t+' '+x.s+' '+x.fw.join(' ')+' '+x.c+' '+x.ty+' '+(x.k||'')).toLowerCase();return q.every(function(w){return h.indexOf(w)>=0})});
$('#count').textContent=r.length+' of '+LIB.length+' items';
$('#res').innerHTML=r.length?r.slice(0,st.n).map(function(x){var m=[x.g&&(x.g+' gate'),x.lv&&('Level '+x.lv),x.c,x.fw.slice(0,2).join(' · ')].filter(Boolean).join(' · ');return '<li><span class="ty">'+x.ty+'</span><div><a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>'+(x.m?'<span class="mem">Members</span>':'')+(x.s?'<p>'+esc(x.s)+'</p>':'')+(m?'<small>'+esc(m)+'</small>':'')+'</div></li>'}).join(''):'<li style="display:block;color:var(--mute)">Nothing matches. Try fewer words, or clear the filters.</li>';
$('#more').hidden=r.length<=st.n}
$('#q').addEventListener('input',function(e){st.q=e.target.value;st.n=12;render()});$('#more').onclick=function(){st.n+=24;render()};render();
}).catch(function(){var c=document.getElementById('count');if(c)c.textContent='The Library index did not load. Try again in a minute.'});
})();
