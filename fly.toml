# Fly.io deployment for the AiGovOps Library governed core.
# Prepared, not deployed — per CLAUDE.md, the first deploy (creating the app,
# auth, secrets, a public URL) is Bob's/Ken's irreversible click. See DEPLOY.md.
#
# Rename `app` and set `primary_region` before `fly launch`/`fly deploy`.

app = "aigovops-library-core"
primary_region = "iad"            # pick yours: `flyctl platform regions`

[build]
  dockerfile = "Dockerfile"        # repo-root Dockerfile (includes core/ + plan/)

[env]
  PORT = "8787"
  # keys + ledger live on the mounted volume below, so they persist across deploys
  KEYS_DIR = "/data/keys"
  LEDGER_DIR = "/data/ledger"
  # CORS allow-list. MUST NAME WHERE THE LIBRARY ACTUALLY SERVES. This listed only the github.io
  # mirror — which has served nothing but a "the Library has moved" redirect stub since the
  # membership wall went up. The real Library renders at community.aigovops-foundation.com/library/,
  # whose origin was absent, so every in-page call to this API was CORS-blocked in the browser:
  # /api/ask, /api/verify, /api/skills, /api/socrates and /api/newsroom, on connect.html, gates.html,
  # demo-e2e.html, demo-foundation.html and newsroom.html. Five interactive features, dead for
  # members, invisible because the rendered Library was marked `gated` and never crawled.
  # (Same shape as beacon lab-service's allowlist naming bobrapp.github.io after the org move.)
  # The mirror origin is kept: harmless, and the stub may still be reached from an old link.
  ALLOWED_ORIGINS = "https://aigovops-foundation.github.io,https://community.aigovops-foundation.com"
  ALLOW_CLOUD = "false"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false      # scale to zero when idle ($0)
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "aigov_data"            # persists /data/keys (Ed25519) + /data/ledger (receipts)
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"                  # dependency-free Node core is tiny
