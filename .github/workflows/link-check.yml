name: link-check

# THE WEEKLY LINK CHECK, OVER THE WHOLE ESTATE — ladder row 11.
#
# What this used to be: this repo adopting the shared link checker for ONE site, its own Pages
# stub. What it is now: one matrix over estate.yaml, so every ungated property the Foundation
# publishes is checked by the same lane.
#
# The gap that motivated it is worth recording. The estate publishes eight properties. This lane
# checked one of them, for as long as it existed — not because anyone decided the other seven
# did not matter, but because adopting a shared workflow meant opening another repository, and
# that is a decision nobody makes on a Tuesday. Seven reusable workflows here carry adoption
# instructions in their headers; exactly one had been adopted cross-repo in two years.
#
# The matrix is DERIVED from the manifest by scripts/estate-matrix.mjs. Add a property to
# estate.yaml and it is checked from the next run; there is no second list to remember. Gated
# properties are excluded and NAMED in the log, because a lane covering six of eight while
# reading as complete is the hollow green this estate keeps finding.
#
# WHAT IS STILL NOT MATRIXED, AND WHY — the honest half of row 11.
#
# Two of the seven reusables take a URL and so work against any property: link-check (this lane)
# and interaction-crawl (run over the same manifest by estate-crawl.mjs). A third,
# red-main-watchdog, was matrixed over estate.yaml by estate-watchdog.yml for two days (row 11a,
# 2026-10-18) and then retired with every per-repo caller on 2026-10-20: it needed a cross-repo
# token Bob chose not to mint, and GitHub already mails a founder when a run fails, so it was a
# second alarm for the same red. What replaced it is estate-uptime.yml — is each live service UP,
# every 30 minutes, a message only when that answer changes. The other four — secret-scan,
# repo-sync-check, stale-sweep, dependency-triage — still operate on the CALLING repository's
# checkout and stay per-repo; they run weekly or monthly.

on:
  schedule:
    - cron: "0 16 * * 1"   # Mondays 16:00 UTC — link rot is a weekly-cadence problem
  workflow_dispatch:

# The CALLER must grant what the called workflow asks for — a reusable workflow's permissions
# can only be a SUBSET of its caller's. reusable-link-check.yml asks for `contents: read`.
permissions: { contents: read }

concurrency: { group: link-check, cancel-in-progress: true }

jobs:
  # One job whose only output is the list. Kept separate so the matrix is visible in the log as
  # a decision — including what was left out — before any checking starts.
  properties:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "20" }
      # The readable version first, so the log says what is checked and what is excluded and why,
      # every week, whether or not anyone is reading. It exits non-zero on an EMPTY matrix: a
      # lane that checks nothing must not report success.
      - name: What this run will check, and what it will not
        run: node scripts/estate-matrix.mjs
      - name: Build the matrix
        id: build
        run: echo "matrix=$(node scripts/estate-matrix.mjs --json)" >> "$GITHUB_OUTPUT"

  link-check:
    needs: properties
    strategy:
      # One property with rotted links must not cancel the check on the other five. The whole
      # point of the matrix is that every property gets looked at on every run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.properties.outputs.matrix) }}
    name: link-check (${{ matrix.name }})
    uses: ./.github/workflows/reusable-link-check.yml
    with:
      site_url: ${{ matrix.site_url }}
      max_pages: ${{ matrix.max_pages }}
      fail_on_external: ${{ matrix.fail_on_external }}
