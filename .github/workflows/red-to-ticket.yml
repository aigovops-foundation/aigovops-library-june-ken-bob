name: red-to-ticket

# File one local work-queue issue when a scheduled check fails: failures only, at most one
# notification per check per day (see reusable-red-to-ticket.yml). The daily "Estate health" digest
# stays the summary.
# estate-interaction-crawl IS watched (since 2026-11-22), although it has its own pinned issue +
# mail: those only fire once the job reaches its mail step. The crawl died before that step
# every day from 2026-10-30 to 2026-11-21 and told no one. A ticket is filed from outside the
# run, so it does not depend on the run getting anywhere. Red pages do not fail that run, so
# red there means the crawl broke and green means it ran.
#
# estate-uptime is NOT watched, on purpose. Its run is red only on a NEW outage and green on
# every later poll of the same outage (one failure mail per incident, not 48 a day). This lane
# marks a ticket green again (and takes it out of `queue`) on the next green run, so it would do
# that thirty minutes into an outage that was still going on. Watching it needs a health signal that tells "all
# up" from "still down"; until then its own pinned issue and flip mail are the alarm.
# Not watched either: founders-digest and stale-sweep do not go red; ci/pages/deploy are push lanes.
on:
  workflow_run:
    workflows: [estate-audit, link-check, repo-sync-check, library-tests, estate-interaction-crawl]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read
  checks: read

jobs:
  ticket:
    uses: ./.github/workflows/reusable-red-to-ticket.yml
