name: deploy-validate
# Validate the deploy stack on every push (repeatability), and offer a gated
# manual deploy. The actual deploy needs an environment with host access + the
# 1Password service-account token — those are operator-provided secrets, never in
# the repo. CI only proves the stack is well-formed.
on:
  push: { paths: [ "deploy/**", "Dockerfile", ".github/workflows/deploy.yml" ] }
  pull_request: { paths: [ "deploy/**", "Dockerfile" ] }
  workflow_dispatch: {}

# Least privilege, declared (policies/autonomy.yaml). Validation only — nothing is deployed
# from CI, so nothing here needs write.
permissions: { contents: read }

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint bootstrap.sh
        run: bash -n deploy/bootstrap.sh
      - name: Render a dev .env (no secrets)
        run: bash deploy/bootstrap.sh --render --dev || cp /dev/null deploy/.env && bash deploy/bootstrap.sh --dev >/dev/null 2>&1 || true
      - name: Validate docker-compose
        run: |
          cd deploy
          [ -f .env ] || echo "SECRETS_PROFILE=lab" > .env
          docker compose -f docker-compose.yml config -q
          echo "✅ compose is valid"
      - name: Validate prometheus config present
        run: test -f deploy/prometheus.yml && test -f deploy/grafana/provisioning/datasources/prometheus.yml
      - name: Detect whether the Dockerfile changed
        id: df
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          changed=true   # workflow_dispatch / first push: build anyway
          if [ -n "$base" ]; then
            git fetch -q --depth=1 origin "$base"
            git diff --name-only "$base" HEAD | grep -qx "Dockerfile" || changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # Build only: the image is never pushed and needs no secrets. A real pass
      # or fail on a base-image bump (aigovops-foundation/aigovops#54).
      - name: Build the repo-root image
        if: steps.df.outputs.changed == 'true'
        run: docker build -t aigovops-library:ci .
      - name: Smoke check the image (/livez, no secrets)
        if: steps.df.outputs.changed == 'true'
        run: |
          docker run -d --name library-core -p 8787:8787 aigovops-library:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/livez && exit 0
            sleep 1
          done
          docker logs library-core
          exit 1

  deploy:
    # Gated: requires a configured `production` environment (host + OP token).
    # Left as a documented, manually-triggered job — never auto-runs.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy (operator-gated)
        run: |
          echo "This job deploys to the production host. It requires:"
          echo "  • a 'production' GitHub Environment with OP_SERVICE_ACCOUNT_TOKEN + host access"
          echo "  • see deploy/README.md for the runbook."
          echo "Intentionally a no-op until those operator secrets are configured."
