name: red-main-watchdog

# This repo adopting the estate's shared red-main watchdog — the proof-of-pattern for rolling
# it out across the estate (one `uses:` line per repo).
#
# It runs on a schedule rather than on push BECAUSE the failure it catches is duration, not an
# event: a main that has been red for days while everyone assumes it is green. Two estate repos
# were exactly that in July 2026 — nobody was told, because nothing was watching.

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC daily (08:00 PT) — a working-hours alarm, not a 3am one
  workflow_dispatch:

# The CALLER has to grant what the called workflow asks for: a reusable workflow's `permissions`
# can only ever be a SUBSET of its caller's, never a superset. This repo's default token is the
# stock "read repository contents" set — which covers `contents` and `metadata` and grants
# `actions: none`. The watchdog reads Actions history, so it needs `actions: read`, and with no
# block here every run died before it started:
#
#   The workflow is requesting 'actions: read', but is only allowed 'actions: none'.
#
# That is a startup_failure, which produces no job, no log and no notification — so this alarm
# was silently dead from 2026-07-24 to 2026-07-31 while appearing to be configured and "active".
permissions:
  contents: read
  actions: read

jobs:
  red-main:
    uses: ./.github/workflows/reusable-red-main-watchdog.yml
    with:
      max_red_hours: 48
