name: repo-sync-check

# Adopting the estate's shared repo-sync lane (one `uses:` line — rationale lives in the Library).
#
# It asks the question no other lane asks: is anything that matters living ONLY on somebody's
# laptop? On 2026-08-04 an estate audit found stranded work three times in a single day and every
# control was green, because every control only ever looked at what had already been pushed.
#
# Weekly, not daily: work strands on a scale of days-to-weeks, and a lane that reports the same
# tidy-up every morning is one people learn to scroll past.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC — before the week's work piles up
  workflow_dispatch:

# The CALLER must grant what the called workflow asks for: a reusable workflow's permissions can
# only ever be a SUBSET of its caller's, and the stock default token is `contents`/`metadata` only.
# Omitting this block is what left the red-main watchdog dead at startup — no job, no log, no
# notification — across all six estate repos for a week in July 2026.
permissions:
  contents: read

jobs:
  repo-sync:
    # SAME REPO, so a LOCAL path rather than owner/repo@ref. Found by
    # reusable-estate-audit.yml on its first run (2026-09-30): this was
    # `aigovops-foundation/aigovops-library-june-ken-bob/...@main`, i.e. the Library
    # reaching across the network for its own file at a moving ref. A local `./` path
    # always resolves to the callee AT THIS COMMIT, so caller and callee can never
    # drift apart and there is nothing to pin or bump.
    uses: ./.github/workflows/reusable-repo-sync-check.yml
