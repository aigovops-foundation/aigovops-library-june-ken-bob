name: reusable-red-main-watchdog

# A reusable, dependency-free watchdog that fails LOUD when a repo's default branch has been
# red for longer than a threshold. Adopt it in one line; it needs no PAT and no external action.
#
# Adopt it from another repo with:
#   jobs:
#     red-main:
#       uses: aigovops-foundation/aigovops-library-june-ken-bob/.github/workflows/reusable-red-main-watchdog.yml@d402457658f626cbdb77ec6f7de08916e829e7d9 # main 2026-10-18
#       with:
#         max_red_hours: 48          # optional (default 48)
#         workflow_file: "ci.yml"    # optional; omit to watch every workflow on the branch
#
# WHY THIS EXISTS. A red main is only a control if somebody hears it. In the 2026-07 estate
# sweep, TWO default branches had been failing for WEEKS with nobody notified — the Foundation
# site's live-site E2E, and Omni-v4's nightly corpus drift (12 days, 13 orphaned branches). Both
# were found by a human happening to look. A control that reports healthy while nobody is
# watching is the most dangerous kind; this one turns "red for a while" into its own failure.
#
# PER-REPO OR ESTATE-WIDE — BOTH, SINCE 2026-10-18. Called with no `repository`, a repo watches
# itself with its own scoped GITHUB_TOKEN and no new secret exists anywhere. Called with
# `repository:` plus the `token` secret, one Library lane (estate-watchdog.yml) watches every repo
# in estate.yaml from a single daily run — Bob's cut-list decision 7, after a year in which ten
# daily per-repo watchdogs produced one alarm email per repo per day for the same stale red. The
# cross-repo token is a standing read-only credential a founder mints and the Library holds; a
# repo the token cannot read is reported UNKNOWN by name, never green.
#
# WHY IT MEASURES DURATION, NOT JUST "IS IT RED". A single failed run is often a flake or a
# transient upstream. What matters — and what nobody notices — is red that STAYS red. The job
# walks back through runs to the last success and fails only past the threshold, so a flake
# self-heals on the next green run and a genuine outage escalates on its own.
#
# WHY THE CALLER MUST DECLARE `permissions`. This workflow reads Actions history, so it needs
# `actions: read` — and a called workflow's permissions can only be a SUBSET of its caller's.
# A caller on the stock default token (`contents`/`metadata` only) therefore cannot satisfy it
# and the run dies at startup, with no job and no log. Every adopting caller needs:
#     permissions:
#       contents: read
#       actions: read
#
# WHY IT IGNORES ITS OWN WORKFLOW. A watchdog that counts its own runs as evidence is a trap:
# the moment it alarms, its own failure becomes the red it is alarming about, and it stays red
# forever even after the real problem is fixed. It can never return to green under its own
# power. So the verdict excludes the calling workflow's own id — it is still REPORTED, so a
# broken watchdog is visible, but it cannot latch itself.
#
# WHY IT FETCHES RUNS PER WORKFLOW. One global `actions/runs?per_page=100` sounds equivalent but
# is not: in a busy repo those 100 runs are consumed by whatever pushed most recently. On Omni
# that window reached back only ~2.6 days, so a workflow red for a week measured as "53h" — and
# a repo just slightly busier would push the window under the threshold, making a permanently
# red main UNDETECTABLE. Querying each workflow's own history keeps the depth independent of
# how noisy its neighbours are.

on:
  workflow_call:
    inputs:
      max_red_hours:
        description: "Fail once the default branch has been failing for longer than this many hours."
        required: false
        type: number
        default: 48
      workflow_file:
        description: "Optional workflow filename (e.g. ci.yml) to watch. Omit to watch all workflows."
        required: false
        type: string
        default: ""
      repository:
        description: "owner/repo to watch. Omit to watch the calling repository. Another repo needs the `token` secret: GITHUB_TOKEN is scoped to the caller and reads nothing else."
        required: false
        type: string
        default: ""
    secrets:
      token:
        description: "Read-only token (Actions: read, Contents: read) for the watched repository. Falls back to GITHUB_TOKEN, which only sees the calling repository."
        required: false

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if the default branch has been red past the threshold
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          MAX_RED_HOURS: ${{ inputs.max_red_hours }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          REPO: ${{ inputs.repository || github.repository }}
          SELF_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # Can the token see this repository at all? GITHUB_TOKEN reads only the calling repo;
          # a private repo elsewhere 404s on metadata before any Actions call. Either way, a
          # check that could not run reads as UNKNOWN by name — never as green, and not as a
          # daily alarm either: the fix is a credential (the `token` secret), not a code change.
          if ! branch=$(gh api "repos/$REPO" --jq .default_branch 2>/dev/null) \
             || ! gh api "repos/$REPO/actions/workflows?per_page=1" --jq .total_count >/dev/null 2>&1; then
            echo "::warning::red-main-watchdog: UNKNOWN — cannot read $REPO (metadata or Actions history) with the token provided; a cross-repo watch needs the 'token' secret with Actions: read, Contents: read."
            exit 0
          fi

          # The verdict excludes this workflow's own id — only meaningful when watching the repo it runs in.
          self_id=""
          if [ "$REPO" = "$SELF_REPO" ]; then
            self_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id) || self_id=""
          fi

          if [ -n "$WORKFLOW_FILE" ]; then
            gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE" --jq .id > ids.txt \
              || { echo "could not read workflow $WORKFLOW_FILE"; exit 1; }
          else
            # Disabled workflows are excluded deliberately: someone turned them off on purpose,
            # and nagging daily about a job that is meant to be off is the cry-wolf failure mode.
            gh api "repos/$REPO/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.state == "active") | .id' > ids.txt \
              || { echo "could not list workflows"; exit 1; }
          fi

          mkdir -p runs
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api "repos/$REPO/actions/workflows/$id/runs?branch=$branch&per_page=100" > "runs/$id.json" \
              || { echo "could not read Actions history for workflow $id"; exit 1; }
          done < ids.txt

          BRANCH="$branch" SELF_ID="$self_id" python3 - <<'PY'
          import glob, json, os, sys
          from datetime import datetime, timezone

          branch = os.environ.get("BRANCH", "").strip() or "main"
          self_id = os.environ.get("SELF_ID", "").strip()

          # Judge EACH workflow, not just the most recent run overall. A single-latest-run check
          # reports green whenever ANY workflow ran green recently — so a nightly job that has been
          # failing for a week hides behind a ci.yml that passed an hour ago. That is exactly how
          # four red workflows sat unnoticed across the estate in 2026-07; this watchdog missed
          # them too until it was made per-workflow. Health is: every workflow's newest run is good.
          GOOD = ("success", "skipped", "neutral")
          limit = float(os.environ["MAX_RED_HOURS"])
          # A workflow whose newest run is this old isn't part of "main health now" — it's dormant
          # or retired (e.g. a cron that was removed leaves a last-failed run on the books forever).
          # We still SHOW it, so a genuinely-stalled schedule isn't hidden, but we don't escalate on
          # it — nagging about a retired job every day is the cry-wolf failure the whole fleet avoids.
          DORMANT_DAYS = max(14.0, 2.0 * limit / 24.0)
          now = datetime.now(timezone.utc)
          reds, dormant, checked, self_row = [], [], 0, None

          def age_h(run):
              return (now - datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))).total_seconds() / 3600.0

          for path in sorted(glob.glob("runs/*.json")):
              wf_id = os.path.basename(path)[:-len(".json")]
              wf_runs = [r for r in json.load(open(path)).get("workflow_runs", [])
                         if r.get("status") == "completed"]
              if not wf_runs:                   # never run on this branch, or call-only (reusable)
                  continue
              checked += 1
              wf_runs.sort(key=lambda r: r["created_at"], reverse=True)
              latest = wf_runs[0]
              if latest["conclusion"] in GOOD:
                  continue
              first_bad = latest
              for r in wf_runs:                 # walk back to the last good run
                  if r["conclusion"] in GOOD:
                      break
                  first_bad = r
              # Every run we fetched is bad, so we never actually saw it go green — the true red
              # age is at least this, and is reported with ">=" rather than as a precise figure.
              floor = all(r["conclusion"] not in GOOD for r in wf_runs)
              name = latest.get("name") or wf_id
              row = (age_h(first_bad), name, first_bad, floor)
              if wf_id == self_id:
                  self_row = row
              elif age_h(latest) > DORMANT_DAYS * 24.0:
                  dormant.append((age_h(latest), name, latest))
              else:
                  reds.append(row)

          if not checked:
              print("red-main-watchdog: no completed runs to judge — not asserting health.")
              sys.exit(0)

          # Sort on the numeric key only — tuples carrying a dict raise TypeError on ties.
          reds.sort(key=lambda x: x[0], reverse=True)
          dormant.sort(key=lambda x: x[0], reverse=True)

          if self_row:
              red_h, name, fb, floor = self_row
              print(f"note: this watchdog's own workflow ('{name}') is {'>=' if floor else ''}{red_h:.1f}h red. "
                    f"It is excluded from the verdict below — a watchdog that counts its own alarm as "
                    f"the fire can never go green again. Its runs are visible in Actions.\n")

          if dormant:
              print(f"--- dormant (latest run failed, but not run in {DORMANT_DAYS:.0f}+ days — retired? not escalating): {len(dormant)} ---")
              for idle_h, name, r in dormant:
                  print(f"  {idle_h/24.0:5.0f}d idle  {name}  (last run {r['conclusion']}: {r.get('html_url')})")
              print("")

          if not reds:
              print(f"red-main-watchdog: {os.environ.get('REPO', '')} green — every ACTIVE workflow's latest run is good "
                    f"({checked} workflow(s) on {branch}, {len(dormant)} dormant).")
              sys.exit(0)

          over = [x for x in reds if x[0] > limit]
          print(f"{checked} workflow(s) on {branch}; {len(reds)} actively red (threshold {limit:.0f}h):\n")
          for hours, name, fb, floor in reds:
              flag = "  <-- OVER THRESHOLD" if hours > limit else ""
              print(f"  {'>=' if floor else '  '}{hours:6.1f}h  {name}{flag}")
              print(f"           since {fb['created_at']}: {fb.get('html_url')}")

          if over:
              worst_h, worst_n, worst_fb, worst_floor = over[0]
              summary = (f"{len(over)} workflow(s) red past {limit:.0f}h on {branch} — "
                         f"worst: '{worst_n}' for {'>=' if worst_floor else ''}{worst_h:.1f}h "
                         f"(since {worst_fb['created_at']}: {worst_fb.get('html_url')})")
              # Alarm ONCE per incident, judged from the incident itself, not from this
              # watchdog's own history. A red that crossed the threshold within the last
              # ALARM_WINDOW hours is new and fails the run; an older one has already been
              # alarmed and is reported as a warning. The window equals the daily cadence so
              # each crossing is seen by exactly one run (a 36h window had two runs inside it
              # and sent duplicate alarms). Each workflow has its own first_bad age, so a second
              # workflow going red later still gets its own alarm, and a workflow_file-filtered
              # watchdog behaves the same way. A crossing older than the window when the
              # watchdog first runs is reported as a warning, with the rows above — not silent.
              ALARM_WINDOW = 24.0
              fresh = [x for x in over if x[0] - limit <= ALARM_WINDOW]
              if not fresh:
                  print(f"\n::warning::still red (alarmed when it first crossed {limit:.0f}h): {summary}")
                  sys.exit(0)
              new_h, new_n, new_fb, new_floor = fresh[0]
              print(f"\n::error::{len(over)} workflow(s) red past {limit:.0f}h on {branch} — "
                    f"newly over the threshold: '{new_n}' for {'>=' if new_floor else ''}{new_h:.1f}h "
                    f"(since {new_fb['created_at']}: {new_fb.get('html_url')})"
                    + (f"; longest: '{worst_n}' for {'>=' if worst_floor else ''}{worst_h:.1f}h" if worst_n != new_n else ""))
              sys.exit(1)

          print(f"\nred-main-watchdog: {len(reds)} red but all under {limit:.0f}h — not escalating yet "
                f"(a flake should go green on the next run).")
          PY
