  <!-- GOOD: should all classify WIRED/LINK -->

  <a href="https://example.com">External link</a>
  <a href="#sec">Anchor to existing</a>
  <h2 id="sec">Section</h2>
  <button onclick="void 0">Wired via onclick</button>

  <div class="card" style="cursor:pointer"><a href="good.html">covered child link</a></div>
  <a href="good.html"><span style="cursor:pointer">span inside a link</span></a>
  <form action="good.html"><button type="submit">Submit</button></form>

  <button>Dead button (no handler)</button>                 <!-- DEAD -->
  <div class="btn" style="cursor:pointer">Dead card (no handler) &rarr;</div> <!-- DEAD -->

  <script>document.getElementById('js-wired').addEventListener('click', () => {});</script>
</body></html>
