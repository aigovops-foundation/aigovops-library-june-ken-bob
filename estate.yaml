# ── Data stores — the rows that decide what we may say in public ──────────────────
data_stores:
  - id: signed-ledger
    where: "Omni (droplet A) — append-only NDJSON, moving to Postgres"
    classification: operational
    contains: "Metadata-only receipts — op, scope, decision, timestamps. No payloads."
    verified: false
    source: "CLAUDE.md; plan/processes/decision-2026-07-19-ledger-pii.md"
    risk: "Documented exception: 31 historic records contain PII (emails, names, question texts). The decision of record is to document the exception, not rewrite an append-only chain. New writes are metadata-only."

  - id: member-store
    where: "Omni (droplet A)"
    classification: personal
    contains: "Member records — names, emails, membership state"
    verified: false
    source: "plan/estate-review-2026-07-19.md Wave 4"
    risk: "The member directory was public once already, and a page nobody had classified defaulted to PUBLIC. This manifest defaults to unknown instead, which is why unknown is never treated as safe."

  - id: session-state
    where: "Omni (droplet A) — sessions.json, magic_links.json"
    classification: secret
    contains: "Live session ids and magic links. A session id is the account."
    verified: false
    source: "plan/estate-review-2026-07-19.md Wave 0 finding 2"

  - id: beacon-keys
    where: "core/keys/ (gitignored) and the Fly/1Password secret stores"
    classification: secret
    contains: "Ed25519 signing keys"
    verified: true
    source: "CLAUDE.md; .gitignore"
    risk: "A dev keypair sat in HEAD of a public repo for six weeks in June 2026 because the ignore rule covered only core/keys/. Rotated; the ignore rule now covers the whole pattern."

  - id: offsite-backup
    where: "unknown"
    classification: unknown
    contains: "Ledger and member-store snapshots — if it is running at all"
    verified: false
    source: "plan/estate-review-2026-07-19.md W1-2"
    risk: "Reported success daily while copying nothing. The control now reads red when the remote is unset. Whether a restorable copy exists off nyc1 today is still unknown, and that is the single most important unknown in this file."

  - id: audit-reports
    where: "audit/ — gitignored on purpose"
    classification: operational
    contains: "Repo audit output naming private repositories"
    verified: true
    source: "plan/processes/repo-audit.md"

