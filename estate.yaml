# estate.yaml — the AiGovOps estate manifest
#
# ONE INPUT. Every domain, repository, served site, running service, outside vendor, data
# store and person, in one place, with an owner and a data classification on every row.
# The three files that used to hold slices of this — estate-sites.json, founders.json,
# repo-audit.config.json — become derived views. `node scripts/estate-manifest.mjs --check`
# fails the build the moment they disagree with this file.
#
# THE HONESTY RULE. Every row carries `verified:`. `verified: false` means the row was read
# out of our own documents, not confirmed against the live system or the GitHub API — which
# cannot happen until decision D6 (the read-only connection) is made. Unverified rows are
# counted and printed on every run. Per the 2026-07-19 estate review: a check that could not
# run reads as UNKNOWN, never as green. "Everything is fine" needs zero problems AND zero
# unknowns, and this manifest is a long way from that today. That is the point of it.
#
# STATUS: DRAFT. Not ratified. `canonical_domain` is empty because decision D1 has not been
# made. Nothing in this file causes an action; it describes what we believe we have.
# Plan of record: plan/auto-running-foundation.md · Rule of record: plan/processes/estate-manifest.md

version: 1
status: unknown
drafted: "2026-08-22"
ratified_by: null
canonical_domain: null            # pending D1 — recommendation is aigovops-foundation.com
notes: "Draft one. Sources are this repo's own files and the 2026-07-19 estate review; nothing here was confirmed against a live API."

