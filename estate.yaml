    role: "The mono-repo trunk. Holds packages/ (npm libraries) and, from 2026-08-23, products/ — vendor-rfi, lantern, umbrella, beacon. Was the platform — Jeeves, Beacon, Umbrella, Lantern together (28 workspaces, 193 tests)"
    visibility: public
    disposition: trunk
    pages_url: "https://aigovops-foundation.github.io/aigovops/"
    verified: true
    source: "first-hand — five PRs pushed and merged into aigovops-foundation/aigovops on 2026-08-23 (#2, #3, #4, #5, #6)"
    risk: "CLOSED 2026-08-23 — the repo is in the org. Was: Foundation production IP in a personal account, the highest-severity item both council models agreed on. No Foundation production IP remains under a personal account."
    note: "D3 is DONE. Transferred to the org and renamed `aigovops` (Bob, via the GitHub assistant, 2026-08-23), Pages re-enabled under the org, and the last blocker cleared: the onboarding iframe could not use a github.com URL and Pages does not follow rename redirects, so it had to be repointed by hand — docs/onboarding.html now loads https://aigovops-foundation.github.io/aigovops/. Verified green by the hourly crawl at 2026-08-23T01:38:39Z: 2 pages, 0 dead, 0 broken."
    library_layer: "packages/{beacon,umbrella,lantern} are a publishable JavaScript library layer (private: false, ~20 modules, 11 test files inside the trunk's 193). Nothing in the trunk imports them — checked 2026-08-23, zero dependencies and zero source imports — but they are tested and they have no counterpart in the standalone products, two of which are Python. They stay."

  - id: aigovops-library-june-ken-bob
    account: aigovops-foundation
    role: "This repo — the Library: docs, the plan tree, the skills tree, the governed core, and the estate automation"
    visibility: public
    disposition: subtree-into-trunk
    pages_url: "https://aigovops-foundation.github.io/aigovops-library-june-ken-bob/"
    verified: true
    source: "this working copy"
    note: "Pages serves redirect-stub only; the Library itself is served behind the membership wall."

  - id: aigovops-beacon
    account: aigovops-foundation
    role: "Signed evidence receipts — Ed25519 + JCS canonical form"
    visibility: public
    disposition: consolidated
    pages_url: "https://aigovops-foundation.github.io/aigovops-beacon/"
    verified: true
    source: "estate-sites.json"
    note: "Carries the signing primitives the Skill Provenance work (M6) builds on."
    canonical: "The STANDALONE REPO is canonical for the product — Bob, 2026-08-23."
    not_a_duplicate: "It shares only a NAME with packages/beacon, which is 7 JS modules (attestation, fluentd, keys, ledger, mlflow, sign) and 5 test files. This repo is seven services (server, agent, mcp, mcp-public, lab-service, studio) plus scoring — 39 Python files and 49 JS. Two of the three standalone products contain little or no JavaScript at all, so the trunk package is not a competing implementation — it is a different layer in a different language. Nothing is duplicated and nothing is retired; the trunk package stays, and what remains open is the shared NAME, not which code wins."
    consolidated: "products/beacon in aigovops-foundation/aigovops — PR aigovops#6, 2026-08-23. filter-repo under the prefix then merge, so log and blame traverse; 75 commits and both authors intact. The ONLY product copy that is not byte-identical to its source: every blob over 1 MiB was stripped (191.56 MiB -> 5.82 MiB), because merging beacon whole would have made the trunk 192 MiB permanently and undoing that is a Red history rewrite. Five media files are absent and about twenty references to them are dead in the trunk copy — recorded in products/beacon/docs/ASSETS-NOT-IN-TRUNK.md, still live on this repo's Pages."

  - id: umbrella-govops
    account: aigovops-foundation
    role: "Conformance gates"
    visibility: public
    disposition: consolidated
    pages_url: "https://aigovops-foundation.github.io/umbrella-govops/"
    verified: true
    source: "estate-sites.json"
    canonical: "The STANDALONE REPO is canonical for the product — Bob, 2026-08-23."
    not_a_duplicate: "It shares only a NAME with packages/umbrella, which is 7 JS modules (authz, compile, kyverno, lifecycle, profiles, rego) and 3 test files. This repo is a PYTHON project — pyproject.toml and a Makefile, 33 .py files against 1 .js. Two of the three standalone products contain little or no JavaScript at all, so the trunk package is not a competing implementation — it is a different layer in a different language. Nothing is duplicated and nothing is retired; the trunk package stays, and what remains open is the shared NAME, not which code wins."
    consolidated: "products/umbrella in aigovops-foundation/aigovops — PR aigovops#5, 2026-08-23. filter-repo under the prefix then merge, so log and blame traverse; 24 commits and both authors intact. This is the product that forced PR aigovops#3: its sdk/typescript test imports a tsup build output it does not commit, so the trunk's old bare `node --test` discovered it and went red."

