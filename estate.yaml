# ── Running services ──────────────────────────────────────────────────────────────
services:
  - id: omni-droplet-a
    kind: "Application host"
    host: "DigitalOcean droplet A (nyc1)"
    status: live
    runs: "Omni — the portal, signin, member store, scheduler, and the signed ledger"
    classification: personal
    verified: false
    source: "plan/estate-review-2026-07-19.md; plan/estate-simplification.md"

  - id: droplet-b
    kind: "Preprod / watchdog host"
    host: "DigitalOcean droplet B (nyc1)"
    status: live
    runs: "Preprod Postgres, the outside watchdog, and the gVisor enclave work"
    classification: operational
    verified: false
    source: "plan/estate-review-2026-07-19.md; plan/MILESTONES.md M2"
    risk: "Both droplets are in nyc1 — the watchdog and the thing it watches share a datacenter, and B cannot take ingress (no tunnel). RTO, not RPO."

  - id: library-core-fly
    kind: "API / governed core"
    host: "Fly.io (iad)"
    status: unknown
    runs: "aigovops-library-core — the Yes-Gate API, OAuth, and the Beacon-signed ledger"
    classification: operational
    verified: false
    source: "fly.toml; docs/durability-plan.html"
    risk: "The repo disagrees with itself: fly.toml says prepared-not-deployed, the durability plan describes it as running with scale-to-zero. Exactly the kind of contradiction this manifest exists to surface."

  - id: github-actions
    kind: "Automation"
    host: "GitHub Actions"
    status: live
    runs: "The clock — hourly interaction crawl, daily tests and red-main watchdog, weekly link and repo-sync checks, monthly stale sweep, continuous secret scan"
    classification: operational
    verified: true
    source: ".github/workflows/"

